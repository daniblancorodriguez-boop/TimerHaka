  /* ---------- Historial ---------- */
  function valText(h) {
    if (h.kind === 'time') return T.fmt(h.value);
    if (h.kind === 'rounds') return h.value + (h.value === 1 ? ' ronda' : ' rondas') + (h.reps ? ' + ' + h.reps : '');
    return 'Completado';
  }
  function deltaHtml(h, prevH) {
    var a = Store.score(h), b = prevH && Store.score(prevH);
    if (!a || !b) return '';
    var d = a.v - b.v; if (!d) return '<span class="h-d same">=</span>';
    var good = a.dir * d > 0, txt;
    if (h.kind === 'time') txt = (d < 0 ? '−' : '+') + T.fmt(Math.abs(d));
    else { var rd = Math.trunc(Math.abs(d) / 1000), rp = Math.abs(d) % 1000; txt = (d < 0 ? '−' : '+') + (rd ? rd + ' r' : '') + (rd && rp ? ' ' : '') + (rp ? rp + ' reps' : '') ; }
    return '<span class="h-d ' + (good ? 'good' : 'bad') + '">' + txt + '</span>';
  }
  function spark(list) {
    var pts = list.slice(-10).map(function (h) { var sc = Store.score(h); return sc ? sc.dir * sc.v : null; }).filter(function (v) { return v !== null; });
    if (pts.length < 2) return '';
    var mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts), W = 96, H = 26;
    var d = pts.map(function (v, i) { return (i * W / (pts.length - 1)).toFixed(1) + ',' + (H - 3 - (mx === mn ? 0.5 : (v - mn) / (mx - mn)) * (H - 6)).toFixed(1); }).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><polyline points="' + d + '" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function viewHistory() {
    var MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    var q = '', selDay = null, now0 = new Date(), mY = now0.getFullYear(), mM = now0.getMonth(), all = [];
    function nrm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
    function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function hay(h) {
      return nrm([h.name, h.modeName, h.modeId].concat((h.lines || []).map(function (l) {
        return (l.parts || []).map(function (pt) { return pt.name; }).join(' ') + ' ' + (l.note || '');
      })).join(' '));
    }
    function filtered() {
      var words = nrm(q).split(/\s+/).filter(Boolean);
      if (!words.length) return all;
      return all.filter(function (h) { var t = hay(h); return words.every(function (w) { return t.indexOf(w) > -1; }); });
    }
    function calendarHtml(list) {
      var byDay = {};
      list.forEach(function (h) { var k = dayKey(h.ts); byDay[k] = (byDay[k] || 0) + 1; });
      var first = new Date(mY, mM, 1), lead = (first.getDay() + 6) % 7, days = new Date(mY, mM + 1, 0).getDate(), todayK = dayKey(Date.now());
      var out = '<div class="cal"><div class="cal-head"><button class="icon-btn mini" data-cal="-1" aria-label="Mes anterior">‹</button>' +
        '<div class="cal-title">' + MONTHS[mM] + ' ' + mY + '</div><button class="icon-btn mini" data-cal="1" aria-label="Mes siguiente">›</button></div>' +
        '<div class="cal-grid">' + ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(function (d) { return '<div class="cal-w">' + d + '</div>'; }).join('');
      for (var i = 0; i < lead; i++) out += '<div class="cal-d out"></div>';
      for (var d = 1; d <= days; d++) {
        var k = mY + '-' + pad(mM + 1) + '-' + pad(d), n = byDay[k] || 0;
        out += '<button class="cal-d' + (n ? ' has' : '') + (k === todayK ? ' today' : '') + (k === selDay ? ' sel' : '') + '" data-day="' + k + '"' +
          ' aria-label="' + d + ' de ' + MONTHS[mM] + (n ? ': ' + n + (n === 1 ? ' entreno' : ' entrenos') : '') + '">' + d + '</button>';
      }
      out += '</div>';
      if (selDay) {
        var ds = list.filter(function (h) { return dayKey(h.ts) === selDay; }).sort(function (x, y) { return x.ts - y.ts; });
        var p = selDay.split('-');
        out += '<div class="cal-day"><div class="cal-day-t">' + (+p[2]) + ' de ' + MONTHS[+p[1] - 1] + '</div>';
        if (!ds.length) out += '<div class="cal-none">Ese día no hay entrenos' + (q ? ' con este filtro' : '') + '.</div>';
        ds.forEach(function (h) {
          var dt = new Date(h.ts);
          out += '<div class="cal-e"><div class="cal-e-top"><span class="h-name">' + esc(h.name) + '</span><span class="chip">' + esc(h.modeName) + '</span></div>' +
            '<div class="cal-e-sub"><span class="h-val">' + esc(valText(h)) + (h.pr ? ' <b class="pr-tag">PR</b>' : '') + '</span><span class="h-date">' + pad(dt.getHours()) + ':' + pad(dt.getMinutes()) + '</span></div></div>';
        });
        out += '</div>';
      }
      return out + '</div>';
    }
    function listHtml(list) {
      var groups = {}, order = [], html = '';
      list.forEach(function (h) { if (!groups[h.key]) { groups[h.key] = []; order.push(h.key); } groups[h.key].push(h); });
      order.sort(function (a, b) { return groups[b][groups[b].length - 1].ts - groups[a][groups[a].length - 1].ts; });
      if (!all.length) return '<div class="empty">Todavía no hay resultados. Termina un entreno y aparecerá aquí.</div>';
      if (!order.length) return '<div class="empty">No hay entrenos que coincidan con «' + esc(q) + '».</div>';
      order.forEach(function (k) {
        var items = groups[k].slice().sort(function (a, b) { return a.ts - b.ts; }), last = items[items.length - 1];
        var scored = items.filter(function (h) { return Store.score(h); }), best = null;
        scored.forEach(function (h) { if (!best || Store.score(h).dir * Store.score(h).v > Store.score(best).dir * Store.score(best).v) best = h; });
        html += '<details class="hist-g"' + (items.length === 1 ? ' open' : '') + '><summary><div class="h-top"><span class="h-name">' + esc(last.name) + '</span><span class="chip">' + esc(last.modeName) + '</span></div>' +
          '<div class="h-sub"><span>' + items.length + (items.length === 1 ? ' vez' : ' veces') + '</span>' +
          (best ? '<span class="h-pr">' + ICON.trophy + valText(best) + '</span>' : '') + '<span class="h-spark">' + spark(items) + '</span></div></summary><div class="h-body">';
        items.slice().reverse().forEach(function (h) {
          var idx = items.indexOf(h), prevH = null;
          for (var j = idx - 1; j >= 0; j--) if (Store.score(items[j])) { prevH = items[j]; break; }
          html += '<div class="h-row"><span class="h-date">' + esc(dateEs(h.ts)) + '</span><span class="h-val">' + esc(valText(h)) + ((h === best) ? ' <b class="pr-tag">PR</b>' : '') + '</span>' +
            deltaHtml(h, prevH) +
            '<button class="icon-btn mini" data-hshare="' + h.id + '" aria-label="Compartir este resultado">' + ICON.share + '</button>' +
            '<button class="icon-btn mini" data-hdel="' + h.id + '" aria-label="Borrar este resultado">' + ICON.trash + '</button></div>';
        });
        if (last.presetId && Store.getPreset(last.presetId)) html += '<button class="btn primary small block" data-hrep="' + last.presetId + '" style="margin-top:8px">' + ICON.play + 'Repetir este entreno</button>';
        html += '</div></details>';
      });
      return html;
    }
    function refresh() {
      all = Store.history();
      var list = filtered();
      $('#h-main').innerHTML = calendarHtml(list) + '<h2 class="h-sec">Historial</h2>' + listHtml(list) +
        (all.length ? '<button class="btn small block" id="h-clear" style="margin-top:10px">Borrar todo el historial</button>' : '');
    }
    app.innerHTML = '<div class="screen">' + header('Historial') +
      '<div class="h-search"><input class="text-in" id="h-q" type="search" placeholder="Buscar por tipo de entreno o ejercicio" autocomplete="off" aria-label="Buscar en el historial"></div>' +
      '<div id="h-main"></div></div>';
    refresh();
    function onInput(e) { if (e.target.id === 'h-q') { q = e.target.value; refresh(); } }
    function onClick(e) {
      var cm = e.target.closest('[data-cal]');
      if (cm) { mM += +cm.dataset.cal; if (mM < 0) { mM = 11; mY--; } else if (mM > 11) { mM = 0; mY++; } selDay = null; refresh(); return; }
      var cd = e.target.closest('[data-day]');
      if (cd) { selDay = selDay === cd.dataset.day ? null : cd.dataset.day; refresh(); return; }
      var sh = e.target.closest('[data-hshare]'), dl = e.target.closest('[data-hdel]'), rp = e.target.closest('[data-hrep]');
      if (sh) { var h = all.filter(function (x) { return x.id === sh.dataset.hshare; })[0]; if (h) { lastResult = h; go('#/share'); } }
      else if (dl) { if (window.confirm('¿Borrar este resultado?')) { Store.removeResult(dl.dataset.hdel); refresh(); } }
      else if (rp) {
        var it = Store.getPreset(rp.dataset.hrep); if (!it) return;
        var err = T.validateLines(it.mode, it.cfg, it.lines); if (err) { toast('Error: ' + err); return; }
        pending = { mode: it.mode, cfg: Object.assign(T.defaultConfig(it.mode), it.cfg), name: it.name, lines: it.lines, numbered: !!it.numbered, presetId: it.id };
        Sound.unlock(); go('#/run');
      } else if (e.target.closest('#h-clear')) { if (window.confirm('¿Borrar TODO el historial?')) { Store.clearHistory(); refresh(); } }
    }
    app.addEventListener('click', onClick);
    app.addEventListener('input', onInput);
    cleanup = function () { app.removeEventListener('click', onClick); app.removeEventListener('input', onInput); };
  }

      var fr = new FileReader();
      fr.onerror = function () { rej(new Error('No se pudo leer la imagen.')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error('Ese archivo no es una imagen válida.')); };
        img.onload = function () {
          var max = 480, sc = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/png'));

        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });

      '<div class="row" style="flex-wrap:wrap;margin:6px 0 10px"><button class="btn small" data-sample="countfile">' + ICON.play + 'Cuenta atrás</button>' +
      '<button class="btn small" data-sample="half">' + ICON.play + 'Mitad</button><button class="btn small" data-sample="well">' + ICON.play + 'Well done</button>' +
      '<button class="btn small" data-sample="lastround">' + ICON.play + 'Last round</button><button class="btn small" data-sample="lastmin">' + ICON.play + 'Last minute</button><button class="btn small" data-sample="tensec">' + ICON.play + 'Ten seconds</button><button class="btn small" data-sample="restvoice">' + ICON.play + 'Rest</button><button class="btn small" data-sample="govoice">' + ICON.play + 'Go</button></div>' +
      '<label class="switch"><span>Vibración</span><input type="checkbox" id="vib"' + (s.vibrate ? ' checked' : '') + '></label>' +
      '<div class="field"><div class="flabel">Volumen</div><input type="range" id="vol" min="0" max="1" step="0.05" value="' + s.volume + '" aria-label="Volumen"></div></div>' +
      '<div class="panel"><h2>Sonidos</h2>' +
      '<p class="s-hint">Para saber qué toca sin mirar la pantalla: pitido corto y agudo = trabajo, tono largo y grave = descanso, vibración distinta en cada caso.</p>' +
      '<button class="btn small block" id="snd-access" style="margin-bottom:10px">Aplicar sonidos distintos por tipo (recomendado)</button>' + sounds + '<div id="snd-msg" class="s-hint" role="status"></div></div>' +
      '<div class="panel"><h2>Tu gimnasio</h2>' +
      '<div class="field"><div class="flabel">Nombre</div><input class="text-in" id="gym" maxlength="40" value="' + esc(s.gymName) + '" placeholder="Nombre del box" autocomplete="off"></div>' +
      '<div class="field"><div class="flabel">Logo (se muestra en la pantalla de inicio y en el reloj)</div>' +
      '<div class="row" style="align-items:center;flex-wrap:wrap"><img class="gym-logo' + logoCls() + '" style="height:56px' + (logoCls() ? ';width:56px' : '') + '" src="' + esc(logoSrc()) + '" alt="Logo actual">' +
      '<label class="btn small" style="cursor:pointer">Cambiar logo<input type="file" accept="image/*" hidden id="logo"></label>' +
      '<button class="btn small" id="logo-reset">Restaurar</button></div></div></div></div>';

    function onChange(e) {
      var t = e.target;
      if (t.id === 'prep') Store.setSettings({ prep: +t.value });
      else if (t.id === 'b3') Store.setSettings({ beepLast3: t.checked });
      else if (t.id === 'dial') Store.setSettings({ dial: t.value === 'classic' ? 'classic' : 'ring' });
      else if (t.id === 'cf') Store.setSettings({ countFile: t.checked });
      else if (t.id === 'hv') Store.setSettings({ halfVoice: t.checked });
      else if (t.id === 'gv') Store.setSettings({ goVoice: t.checked });
      else if (t.id === 'rv') Store.setSettings({ restVoice: t.checked });
      else if (t.id === 'av') Store.setSettings({ alertVoices: t.checked });
      else if (t.id === 'wv') Store.setSettings({ wellVoice: t.checked });
      else if (t.id === 'vib') Store.setSettings({ vibrate: t.checked });
      else if (t.id === 'vol') { Store.setSettings({ volume: +t.value }); }
      else if (t.id === 'gym') Store.setSettings({ gymName: t.value.trim() });
      else if (t.dataset.ev) {
        var ev = t.dataset.ev, cur = Store.settings().sounds[ev] || {};
        Store.setSound(ev, { preset: t.value, data: cur.data, name: cur.name });
        Sound.unlock(); Sound.preview(ev);
      } else if (t.dataset.up && t.files[0]) {
        var evId = t.dataset.up;
        Sound.readFile(t.files[0]).then(function (data) {
          Store.setSound(evId, { preset: 'custom', data: data, name: t.files[0].name });
          Sound.unlock(); Sound.preview(evId); viewSettings(); toast('Sonido guardado');
        }).catch(function (err) { $('#snd-msg').textContent = err.message; });
      } else if (t.id === 'logo' && t.files[0]) {
        resizeLogo(t.files[0]).then(function (url) {
          if (Store.setSettings({ logo: url })) { viewSettings(); toast('Logo actualizado'); }
          else toast('No se pudo guardar el logo');
        }).catch(function (err) { toast(err.message); });
      }
    }
    function onClick(e) {
      var tb = e.target.closest('[data-test]'), sb = e.target.closest('[data-sample]');
      if (tb) { Sound.unlock(); Sound.preview(tb.dataset.test); }
      if (sb) { Sound.unlock(); Sound.preview(sb.dataset.sample); }
      if (e.target.closest('#snd-access')) {
        Object.keys(Sound.ACCESSIBLE).forEach(function (k) { Store.setSound(k, { preset: Sound.ACCESSIBLE[k] }); });
        Store.setSettings({ vibrate: true }); Sound.unlock(); viewSettings(); toast('Sonidos por tipo aplicados');
      }
      if (e.target.closest('#logo-reset')) { Store.setSettings({ logo: null }); viewSettings(); toast('Logo restaurado'); }
    }
    app.addEventListener('change', onChange);
    app.addEventListener('click', onClick);
    cleanup = function () { app.removeEventListener('change', onChange); app.removeEventListener('click', onClick); };
  }

  /* ---------- arranque ---------- */
  window.AppKit = {
    app: app, esc: esc, $: $, $$: $$, header: header, toast: toast, go: go, ICON: ICON, pad: pad, dateEs: dateEs, logoSrc: logoSrc, logoCls: logoCls, wakeLock: wakeLock, loadImg: loadImg,
    setCleanup: function (f) { cleanup = f; },
    setRunGuard: armGuard,
    setShareResult: function (r) { lastResult = r; }
  };
  render();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();


</script>
</body>
</html>
